name: Release

# This workflow ONLY fires when a version tag (v*.*.*) is pushed. It does
# NOT run on pushes to main, PRs, or any other branch activity. The
# `if: startsWith(github.ref, 'refs/tags/v')` guard on every job makes it
# impossible to trigger binary uploads from a non-tag ref, even via a
# manual `workflow_dispatch`.
#
# npm publish is NOT automated here — the maintainer runs `npm publish`
# locally after the tag is pushed. Rationale: publishing is infrequent,
# requires a human-held token, and the additional CI step added little
# value over a local run that also verifies the tarball by eye.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -----------------------------------------------------------------------
  # Create the GitHub Release first, with notes lifted from CHANGELOG.md.
  # This runs before (and independently of) the binary matrix so a release
  # always exists even when every pkg build fails — the binaries are a
  # convenience, the npm package and the notes are the actual release.
  # -----------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Extract release notes for this tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/changelog-section.mjs "$VERSION" > RELEASE_NOTES.md
          echo "--- notes ---"; cat RELEASE_NOTES.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # -----------------------------------------------------------------------
  # Standalone binaries per OS. Uses @yao-pkg/pkg which has known rough
  # edges with ESM-first deps (ink, execa). The job is
  # `continue-on-error: true` so a partial failure here never blocks the
  # release — users can always fall back to `npm i -g hfo-cli`.
  # -----------------------------------------------------------------------
  binary:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: node22-linux-x64
            artifact: hfo-linux-x64
          - os: ubuntu-24.04
            target: node22-linux-arm64
            artifact: hfo-linux-arm64
          - os: macos-26
            target: node22-macos-x64
            artifact: hfo-macos-x64
          - os: macos-26
            target: node22-macos-arm64
            artifact: hfo-macos-arm64
          - os: windows-2025
            target: node22-win-x64
            artifact: hfo-win-x64.exe
          - os: windows-2025
            target: node22-win-arm64
            artifact: hfo-win-arm64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm i -g @yao-pkg/pkg
      - name: Build binary
        shell: bash
        run: |
          mkdir -p dist-bin
          pkg . --targets ${{ matrix.target }} --output dist-bin/${{ matrix.artifact }} || {
            echo "::warning::pkg failed for ${{ matrix.target }} — ESM bundling is best-effort"
            exit 0
          }
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: hashFiles('dist-bin/*') != ''
        with:
          files: dist-bin/*
          fail_on_unmatched_files: false

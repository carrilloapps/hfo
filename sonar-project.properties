sonar.projectKey=hfo-cli
sonar.projectName=hfo
sonar.projectVersion=0.2.1

sonar.sources=src,scripts,bin
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Generated, vendored or non-source trees Sonar should not grade.
sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  dist-bin/**,\
  coverage/**,\
  .security/**,\
  docs/assets/**

# Coverage comes from vitest's lcov reporter (pnpm test:coverage).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Test files are analysed for smells but never counted as duplicated code:
# fixtures and arrange blocks repeat by nature.
sonar.cpd.exclusions=test/**
